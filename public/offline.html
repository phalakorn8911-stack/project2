<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ออฟไลน์ - ร.153 พัน.3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #eab308; }
    p { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.6; }
    .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #eab308; color: #0f172a; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #ca8a04; }
    .tips { margin-top: 2rem; text-align: left; }
    .tips h2 { font-size: 0.875rem; color: #64748b; margin-bottom: 0.5rem; }
    .tips ul { list-style: none; padding: 0; }
    .tips li { padding: 0.5rem 0; color: #94a3b8; font-size: 0.875rem; border-bottom: 1px solid #1e293b; }
    .tips li::before { content: "• "; color: #eab308; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตของคุณ แล้วลองใหม่อีกครั้ง</p>
    <button class="btn" onclick="location.reload()">ลองใหม่</button>
    <div class="tips">
      <h2>สิ่งที่ทำได้ขณะออฟไลน์:</h2>
      <ul>
        <li>ดูข้อมูลที่เคยเปิดก่อนหน้า</li>
        <li>ดูตำแหน่ง GPS ล่าสุด</li>
        <li>ดูรายการใบงานที่บันทึกไว้</li>
      </ul>
    </div>
  </div>
</body>
</html>
